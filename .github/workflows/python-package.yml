# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # No pytest suite yet; keep the step for future unit tests.
        pytest --collect-only || true

  live-demo:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: Live capability scenario (official FlexiBee demo)
      env:
        ABRAFLEXI_URL: https://demo.flexibee.eu:5434
        ABRAFLEXI_COMPANY: demo
        ABRAFLEXI_LOGIN: winstrom
        ABRAFLEXI_PASSWORD: winstrom
        READ_ONLY: "true"
      run: |
        python tests/live_capability_scenario.py \
          --url "$ABRAFLEXI_URL" \
          --company "$ABRAFLEXI_COMPANY" \
          --login "$ABRAFLEXI_LOGIN" \
          --password "$ABRAFLEXI_PASSWORD" \
          --json-out live-demo-report.json
    - name: Upload live report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: live-demo-report
        path: live-demo-report.json
